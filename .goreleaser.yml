version: 2

project_name: upgopher

builds:
  - id: upgopher
    main: .
    binary: upgopher
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
      - "386"
    ignore:
      - goos: darwin
        goarch: "386"
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: upgopher
    ids:
      - upgopher
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    wrap_in_directory: true
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  draft: true
  replace_existing_draft: true
  name_template: "Upgopher {{ .Tag }}"

homebrew_casks:
  - name: upgopher
    ids:
      - upgopher
    binaries:
      - upgopher
    homepage: https://wanetty.github.io/upgopher/
    description: Self-contained browser file and clipboard sharing server
    license: MIT
    commit_msg_template: "chore: update Upgopher to {{ .Tag }}"
    repository:
      owner: wanetty
      name: homebrew-tap
      branch: main
      token: "{{ .Env.DISTRIBUTION_GITHUB_TOKEN }}"
    commit_author:
      name: upgopher-release
      email: noreply@upgopher.dev

scoops:
  - name: upgopher
    ids:
      - upgopher
    homepage: https://wanetty.github.io/upgopher/
    description: Self-contained browser file and clipboard sharing server
    license: MIT
    commit_msg_template: "chore: update Upgopher to {{ .Tag }}"
    repository:
      owner: wanetty
      name: scoop-bucket
      branch: main
      token: "{{ .Env.DISTRIBUTION_GITHUB_TOKEN }}"
    commit_author:
      name: upgopher-release
      email: noreply@upgopher.dev
